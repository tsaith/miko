[project]
name = "miko-backend"
version = "0.1.0"
description = "Python gRPC sidecar for the Miko desktop assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
  "grpcio>=1.71.0",
  "grpcio-tools>=1.71.0",
  "grpcio-health-checking>=1.71.0",
  "protobuf>=5.29.0",
  "pydantic>=2.10.0",
  "pyyaml>=6.0.2",
  "numpy>=2.2.0",
  "opencv-python>=4.10.0.84",
  "openai>=1.72.0",
  "deepgram-sdk>=3.10.1",
  "cartesia>=2.0.0",
  "torch>=2.6.0",
  "silero-vad>=5.1.2",
  "ultralytics>=8.3.0",
]

[tool.uv]
package = false
